name: tests

on:
  push:
  pull_request:
  # Run by hand from the Actions tab; tick "live" to also test chart reading
  # against the real vision model (needs the GROQ_API_KEY repository secret)
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the live chart-reading test (~4 min)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Offline tests
        run: pytest -q
      - name: Live chart-reading test
        if: github.event_name == 'workflow_dispatch' && inputs.live
        env:
          RUN_LIVE_VISION: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: pytest -q tests/test_live_vision.py
