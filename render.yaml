services:
  - type: web
    name: signal-bot
    runtime: python
    # Free instances get no persistent disk, so state.json is wiped on every
    # redeploy and restart. Set the UPSTASH_* variables below (free Redis) and
    # monitored trades and results are kept there instead.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Optional: trades survive restarts (Upstash), backup chart reader
      # (Gemini), error alerts to you (your Telegram user id)
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
